name: Sandbox smoke test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build disposable runtime
        run: docker build -t versionbridge-sandbox:1 -f Sandbox.Dockerfile .
      - name: Verify repair, evidence and containment
        run: python3 smoke.py
      - name: Verify authenticated API and separate worker
        run: python3 api_smoke.py
      - name: Verify V2 safety and independent behavior contracts
        run: python3 -m unittest test_v2 test_v2_sandbox test_experience -v
      - name: Check browser JavaScript syntax
        run: node --check web/app.js && node --check web/resources.js && node test_workflow.cjs && node test_edge.mjs && python3 version_assets.py --check
