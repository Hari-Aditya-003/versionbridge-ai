name: Sandbox smoke test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable runtime
        run: docker build -t versionbridge-sandbox:1 -f Sandbox.Dockerfile .
      - name: Verify model routing without paid inference
        run: python3 -m unittest test_model_routing.py
      - name: Verify repair, evidence and containment
        run: python3 smoke.py
      - name: Verify authenticated API and separate worker
        run: python3 api_smoke.py
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
