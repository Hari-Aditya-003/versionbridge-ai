name: Publish project showcase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build static showcase
        run: |
          mkdir site
          cp web/mark.svg web/style.css web/motion.js web/workflow.js web/brand.png showcase/versionbridge-final-walkthrough.mp4 showcase/VersionBridge-Audio-Script.txt showcase/final-architecture.png site/
          sed -e 's|href="/|href="./|g' -e 's|src="/|src="./|g' \
              -e 's|Run the demo|Watch the demo|g' \
              -e 's|Open demo|Watch demo|g' web/index.html > site/index.html
          cp showcase/demo.html site/demo.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
